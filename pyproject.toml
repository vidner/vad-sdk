[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vad-checker"
version = "0.2.0"
description = "Checker SDK for the vad attack-defense platform"
requires-python = ">=3.11"
dependencies = ["nats-py==2.15.0", "PyYAML==6.0.3"]

[tool.setuptools.packages.find]
where = ["src"]
